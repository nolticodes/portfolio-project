<section class="full_width">
    <div class="project_content">

        <div class="project_content_grid_element project_content_grid_element_single">
            <div class="project_content_grid_element_single_text">
                <p>{{ 'home.projects.craft' | translate}}</p>
                <h2>{{ 'home.projects.projects' | translate}}</h2>
                <img [src]="'assets/animation_img/projects/line_orange.svg'">
                <p>{{ 'home.projects.introduction' | translate}}</p>
            </div>
        </div>

        @for (project of projectData; track project.name) {
        <div class="project_content_grid_element">
            <div class="project_content_grid_element_img_wrapper">
                <div class="floating_wrapper">
                    <img [src]="project.imageUrl">
                </div>

                <div class="project_content_grid_element_img_wrapper_button">
                    <button class="btn_lets_talk" [routerLink]="['/projects', project.slug]">
                        {{ 'home.projects.projectDetails' | translate}}
                    </button>
                </div>
                <div class="project_content_grid_element_img_wrapper_sticker">
                    <img [src]="'assets/stickers/projects/Sticker.svg'">
                </div>
            </div>
            <div class="project_content_grid_element_text">
                <h2>{{project.name}}</h2>
                <p>{{project.description | translate}}</p>
            </div>
        </div>
        }

    </div>
</section>
