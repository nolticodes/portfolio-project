<form class="contact_form" [formGroup]="userForm" (ngSubmit)="formSubmit()">
    <div class="contact_form_border">
        <label for="name" [class.error-title]="firstNameRequired">{{ 'home.contact.nameQuestion' | translate }}</label>
        <input id="name" type="text" formControlName="firstName" [class.error-placeholder]="firstNameRequired"
            [placeholder]="firstNameRequired
    ? ('home.contact.nameError' | translate)
    : ('home.contact.nameAnswer' | translate)" />
    </div>

    <div class="contact_form_border">
        <label for="mail" [class.error-title]="emailRequired">{{ 'home.contact.emailQuestion' | translate }}</label>
        <input id="mail" type="text" formControlName="eMail" [class.error-placeholder]="emailRequired" [placeholder]="emailRequired
    ? ('home.contact.mailError' | translate)
    : ('home.contact.emailAnswer' | translate)" />
    </div>


    <div class="contact_form_border">
        <label for="message" [class.error-title]="messageRequired">{{ 'home.contact.messageQuestion' | translate }}</label>
        <input id="message" type="text" formControlName="message" [class.error-placeholder]="messageRequired"
            [placeholder]="messageRequired
    ? ('home.contact.messageError' | translate)
    : ('home.contact.messageAnswer' | translate)" />
    </div>

    <div class="contact_form_policy">
        <label class="contact_form_policy_checkbox">
            <input id="checkbox" type="checkbox" formControlName="privacyPolicy">
            <span class="checkmark">
                <img src="assets/img/contact/check.svg">
            </span>
        </label>

        <p for="checkbox"> <span>{{ 'home.contact.policyOne' | translate }}</span> <a routerLink="/privacy-policy"
                >privacy policy</a>
            <span>{{ 'home.contact.policyTwo' | translate }}</span>
        </p>
    </div>
    <div class="btn_section">
        <div class="content_left_img">
            <img [src]="'./assets/animation_img/contact/line.svg'">
        </div>
        <button class="btn_lets_talk" type="submit" [disabled]="userForm.invalid">
            {{ 'home.contact.send' | translate }}
        </button>
    </div>
</form>
